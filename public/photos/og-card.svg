<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070d"/>
      <stop offset="50%" stop-color="#0e0e18"/>
      <stop offset="100%" stop-color="#141422"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Outer Glow Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Brand Tag Header -->
  <text x="90" y="130" font-family="monospace" font-size="28" font-weight="700" fill="#00ffcc">&lt;bitwise-adi /&gt;</text>

  <!-- Main Name -->
  <text x="90" y="240" font-family="sans-serif" font-size="72" font-weight="800" fill="url(#textGrad)">Aditya Raj</text>

  <!-- Subtitle -->
  <text x="90" y="310" font-family="sans-serif" font-size="32" font-weight="600" fill="#a78bfa">Developer, Builder &amp; ISE @ NIE Mysore</text>

  <!-- Description -->
  <text x="90" y="380" font-family="sans-serif" font-size="22" font-weight="400" fill="#9a9ab0">Full-Stack Web Apps • ML Threat Models • Encrypted Systems • PWA</text>

  <!-- Feature Pills -->
  <g transform="translate(90, 460)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="42" rx="21" fill="rgba(0,255,204,0.1)" stroke="rgba(0,255,204,0.3)" stroke-width="1"/>
    <text x="70" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#00ffcc" text-anchor="middle">LocoMe</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="160" height="42" rx="21" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="240" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">GradeBuddy</text>

    <!-- Pill 3 -->
    <rect x="340" y="0" width="180" height="42" rx="21" fill="rgba(251,146,60,0.1)" stroke="rgba(251,146,60,0.3)" stroke-width="1"/>
    <text x="430" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle">RansomGuard.ai</text>

    <!-- Pill 4 -->
    <rect x="540" y="0" width="140" height="42" rx="21" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.3)" stroke-width="1"/>
    <text x="610" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#f43f5e" text-anchor="middle">NOVA Chat</text>
  </g>

  <!-- URL Footer -->
  <text x="1070" y="530" font-family="monospace" font-size="20" font-weight="700" fill="#00ffcc" text-anchor="end">bitwise-adi.dev</text>
</svg>
